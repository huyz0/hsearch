[workspace]
resolver = "2"
members = ["crates/types", "crates/observe", "crates/engine", "crates/object", "crates/object-probe", "crates/testkit", "xtask"]
default-members = ["crates/types", "crates/observe", "crates/engine", "crates/object"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/huyz0/hsearch"

[workspace.dependencies]
hsearch-types = { path = "crates/types" }
hsearch-observe = { path = "crates/observe" }
hsearch-testkit = { path = "crates/testkit" }
lucene-analysis = { git = "https://github.com/huyz0/lucene-rust", rev = "46e280bc2a208544fb36ecd95932e89cd8bc5618", default-features = false }
lucene-codecs = { git = "https://github.com/huyz0/lucene-rust", rev = "46e280bc2a208544fb36ecd95932e89cd8bc5618", default-features = false }
lucene-index = { git = "https://github.com/huyz0/lucene-rust", rev = "46e280bc2a208544fb36ecd95932e89cd8bc5618", default-features = false }
lucene-search = { git = "https://github.com/huyz0/lucene-rust", rev = "46e280bc2a208544fb36ecd95932e89cd8bc5618", default-features = false }
lucene-store = { git = "https://github.com/huyz0/lucene-rust", rev = "46e280bc2a208544fb36ecd95932e89cd8bc5618", default-features = false }

# Coordinator research: testkit dev targets only; exact retained pins.
openraft = { git="https://github.com/databendlabs/openraft", rev="8815cdba2826f74e848acef361ad03f93bb1c3f8", default-features=false, features=["serde","storage-v2"] }
raft = { git="https://github.com/tikv/raft-rs", rev="10c6e9db6792b85c81784e44fc278f895d5f0ab0", default-features=false, features=["protobuf-codec"] }
serde = { version="=1.0.228", features=["derive"] }
serde_json = "=1.0.145"
tokio = { version="=1.48.0", default-features=false, features=["rt-multi-thread","sync","time","macros"] }
protobuf = "=2.28.0"
slog = "=2.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
