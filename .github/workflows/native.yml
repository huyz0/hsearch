name: native qualification

on:
  workflow_call:
    outputs:
      differential:
        description: Bounded host-verified native profiles and Java architecture package
        value: ${{ jobs.qualify.outputs.differential }}
    inputs:
      runner:
        required: true
        type: string
      mode:
        required: true
        type: string
      plan:
        required: true
        type: string
      head:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ${{ inputs.runner }}
    outputs:
      differential: ${{ steps.differential.outputs.differential }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      CI_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reusable job mode and exact head
        env:
          QUALIFICATION_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          assert os.environ['QUALIFICATION_MODE'] in ('native', 'sandbox')
          assert json.loads(os.environ['CI_PLAN'])['head'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          PY
      - name: Keep native compiler outputs outside source
        if: ${{ inputs.mode == 'native' }}
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/hsearch-target" >> "$GITHUB_ENV"
      - name: Install exact bootstrap toolchain
        if: ${{ inputs.mode == 'native' }}
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Prefetch locked dependencies
        if: ${{ inputs.mode == 'native' }}
        run: cargo fetch --locked
      - name: Install exact bounded native test runner
        if: ${{ inputs.mode == 'native' }}
        run: |
          python3 dev/install_correctness.py "${{ runner.temp }}/hsearch-correctness"
          echo "${{ runner.temp }}/hsearch-correctness" >> "$GITHUB_PATH"
      - name: Qualify selected packages in debug, release, doctests and coverage
        if: ${{ inputs.mode == 'native' }}
        run: python3 tools/ci.py native
      - name: Preserve source-bound native coverage evidence
        if: ${{ always() && inputs.mode == 'native' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT, node24
        with:
          name: coverage-${{ inputs.runner }}-${{ github.run_id }}
          # Preserve public measurements/manifests, not compiler/dependency binaries.
          path: |
            ${{ runner.temp }}/hsearch-coverage-*/summary.json
            ${{ runner.temp }}/hsearch-coverage-*/*/*.json
            ${{ runner.temp }}/hsearch-coverage-*/*/shards/*.json
            ${{ runner.temp }}/hsearch-coverage-*/*/logs-*/*.json
            ${{ runner.temp }}/hsearch-coverage-*/*/logs-*/*.stderr
            ${{ runner.temp }}/hsearch-checker-coverage-*/summary.json
            ${{ runner.temp }}/hsearch-checker-coverage-*/*/*.json
            ${{ runner.temp }}/hsearch-checker-coverage-*/*/shards/*.json
            ${{ runner.temp }}/hsearch-checker-coverage-*/*/logs-*/*.json
            ${{ runner.temp }}/hsearch-checker-coverage-*/*/logs-*/*.stderr
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn
      - name: Build pinned non-root development image
        if: ${{ inputs.mode == 'sandbox' }}
        run: python3 tools/sandbox.py --state-root "${{ runner.temp }}/hsearch-leases" image
      - name: Qualify private RustFS sandbox and cleanup isolation
        if: ${{ inputs.mode == 'sandbox' }}
        run: python3 tools/sandbox.py --state-root "${{ runner.temp }}/hsearch-leases" smoke --evidence-parent "${{ runner.temp }}/hsearch-engine-differential"
      - name: Qualify real semantic corpus, worktree isolation and whole fixture costs
        if: ${{ inputs.mode == 'sandbox' }}
        run: python3 tools/navigation_corpus.py --state-root "${{ runner.temp }}/hsearch-leases" --evidence-parent "${{ runner.temp }}/hsearch-navigation"
      - name: Qualify pinned public reference corpus and isolated cleanup
        if: ${{ inputs.mode == 'sandbox' }}
        run: python3 tools/reference.py --state-root "${{ runner.temp }}/hsearch-leases" --evidence-parent "${{ runner.temp }}/hsearch-api-reference"
      - name: Package host-verified native and Java architecture receipts
        if: ${{ inputs.mode == 'sandbox' }}
        id: differential
        run: python3 tools/engine_differential.py --native "${{ runner.temp }}/hsearch-engine-differential" --reference-parent "${{ runner.temp }}/hsearch-api-reference"
      - name: Preserve only public reference observations and failure evidence
        if: ${{ always() && inputs.mode == 'sandbox' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT, node24
        with:
          name: api-reference-${{ inputs.runner }}-${{ github.run_id }}
          # Never upload the shared lease/snapshot directory: it has TLS keys.
          path: |
            ${{ runner.temp }}/hsearch-api-reference
            ${{ runner.temp }}/hsearch-engine-differential
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: error
      - name: Qualify complete pinned-image capability matrix through ordinary task dispatch
        if: ${{ inputs.mode == 'sandbox' }}
        run: python3 tools/rustfs_probe.py qualify
      - name: Preserve public capability histories and first failures
        if: ${{ always() && inputs.mode == 'sandbox' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT, node24
        with:
          name: rustfs-capabilities-${{ inputs.runner }}-${{ github.run_id }}
          # Exact public exporter output only. Job registry/snapshots hold TLS keys.
          path: ${{ runner.temp }}/hsearch-rustfs-capabilities
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn
