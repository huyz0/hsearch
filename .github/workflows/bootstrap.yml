name: bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      native: ${{ steps.impact.outputs.native }}
      sandbox: ${{ steps.impact.outputs.sandbox }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact manifest reader
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Plan owned impact with conservative fallback
        id: impact
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci.py plan --base "$IMPACT_BASE" --head "$IMPACT_HEAD" --output "${{ runner.temp }}/impact.json"

  docs:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact reader for real Git and Cargo counterexamples
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check planning, models and harness counterexamples
        run: python3 tools/ci.py docs

  linux-x64:
    needs: [plan]
    if: ${{ needs.plan.outputs.native == 'true' }}
    uses: ./.github/workflows/native.yml
    with:
      runner: ubuntu-24.04
      mode: native
      plan: ${{ needs.plan.outputs.plan }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  linux-arm64:
    needs: [plan]
    if: ${{ needs.plan.outputs.native == 'true' }}
    uses: ./.github/workflows/native.yml
    with:
      runner: ubuntu-24.04-arm
      mode: native
      plan: ${{ needs.plan.outputs.plan }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  sandbox-x64:
    needs: [plan]
    if: ${{ needs.plan.outputs.sandbox == 'true' }}
    uses: ./.github/workflows/native.yml
    with:
      runner: ubuntu-24.04
      mode: sandbox
      plan: ${{ needs.plan.outputs.plan }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  sandbox-arm64:
    needs: [plan]
    if: ${{ needs.plan.outputs.sandbox == 'true' }}
    uses: ./.github/workflows/native.yml
    with:
      runner: ubuntu-24.04-arm
      mode: sandbox
      plan: ${{ needs.plan.outputs.plan }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  ci-ok:
    if: ${{ always() }}
    needs: [plan, docs, linux-x64, linux-arm64, sandbox-x64, sandbox-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require every selected job and a successful planner
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci.py gate
