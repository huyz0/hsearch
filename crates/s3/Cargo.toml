[package]
name = "hsearch-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "S3-compatible ObjectBackend and MetadataStore for RustFS and MinIO"

[dependencies]
hsearch-object = { path = "../object" }
hmac = "=0.13.0"
md-5 = "=0.11.0"
sha2 = "=0.11.1"
ureq = { version = "=3.5.2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
# A real SDK, with its own retry loop and classification, run under the adapter's attribution in
# tests only (M03.13). No TLS feature: plain HTTP to the local store, so no C toolchain is pulled in.
aws-sdk-s3 = { version = "=1.159.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.2", default-features = false, features = ["default-client"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt"] }
aws-smithy-runtime-api = { version = "=1.21.0", default-features = false }
hsearch-testkit.workspace = true
