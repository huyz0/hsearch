[package]
name = "hsearch-module-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Native C-ABI extension module loader: the one crate in the workspace where unsafe is allowed (D18)"

[dependencies]
hsearch-module-abi = { path = "../module-abi" }
libloading = "=0.9.1"
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
sha2 = "=0.11.1"

[dev-dependencies]
serde_json = "=1.0.154"

# The workspace forbids `unsafe_code` and a crate cannot both inherit that and relax it, so this crate
# states the same lint set itself. `deny` rather than `forbid`: the single `allow` is on `mod sys`.
# tools/workspace.py check refuses any other crate that does not inherit the workspace lints.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = "deny"
