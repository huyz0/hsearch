[package]
name = "hsearch-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Bounded authenticated peer RPC (M07.02): typed frames over mutual TLS 1.3 with byte, count and time budgets"

[dependencies]
hsearch-security = { path = "../security", features = ["tls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
hsearch-security = { path = "../security", features = ["tls", "dev-ca"] }
zeroize = "=1.9.1"

[lints]
workspace = true
