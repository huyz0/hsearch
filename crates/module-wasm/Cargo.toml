[package]
name = "hsearch-module-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "WASM extension module host: wasmtime with enforced memory, fuel, deadline and host-call limits and no WASI"

[dependencies]
hsearch-module-abi = { path = "../module-abi" }
# Exact pin, Cranelift only: no WASI, no component model, no cache, no async, no threads.
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
sha2 = "=0.11.1"

[dev-dependencies]
wat = "=1.263.0"

[lints]
workspace = true
