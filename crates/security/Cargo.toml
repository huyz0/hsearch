[package]
name = "hsearch-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Verified identity, per-index authorization and the key-provider contract"

[features]
# The development CA mints throw-away certificates. It is not a default feature and no production crate enables it.
dev-ca = ["dep:rcgen", "dep:time"]
# The in-memory test key provider. Non-default; no production crate enables it.
test-kms = []

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
rustls-webpki = { version = "=0.103.17", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.16.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
x509-parser = "=0.18.1"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"], optional = true }
time = { version = "=0.3.55", default-features = false, optional = true }

[[test]]
name = "identity"
required-features = ["dev-ca"]

[[test]]
name = "block"
required-features = ["test-kms"]

[[test]]
name = "keys"
required-features = ["test-kms"]

[[example]]
name = "block_bench"
required-features = ["test-kms"]

[[example]]
name = "security_bench"
required-features = ["dev-ca", "test-kms"]

[lints]
workspace = true
